<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画布工作区 · 登录接续</title><link rel="stylesheet" href="connect.css"></head>
<body><main>
<header><span class="brand" aria-hidden="true">D</span><strong>画布工作区</strong><span class="badge">实验版</span></header>
<section><div class="heading"><h1>Pinterest 接续</h1><span id="state-label">连接中</span></div><p id="status" role="status" aria-live="polite">正在连接 画布工作区…</p></section>
<label class="consent" hidden><input id="consent" type="checkbox">允许将当前 Pinterest 登录会话接回本机 画布工作区</label>
<button id="submit" disabled>连接 Pinterest</button>
<div class="actions"><button id="retry" hidden>检查登录状态</button><button id="stop" hidden>停止</button></div>
<p id="launch-hint" hidden>点击工具栏中的 画布工作区 扩展图标，即可在气泡中继续。</p>
<details><summary>权限与隐私</summary><p>仅访问 Pinterest 会话，不读取 Google Cookie、密码或浏览器配置。仅传给本机 画布工作区，可能切换 画布工作区 的 Pinterest 账号。会话接回不代表登录验证成功；此功能仍为未完成平台许可确认的本机实验。</p></details>
</main><script type="module" src="connect.js"></script></body></html>
