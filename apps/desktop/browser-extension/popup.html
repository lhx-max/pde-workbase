<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>画布工作区 网页采集</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header>
    <span class="mark" aria-hidden="true">
      <img src="logo.svg" width="72" height="28" alt="Loom">
    </span>
    <div class="heading"><strong id="popup-title">画布工作区 网页采集</strong><span id="popup-tagline">让灵感成为你的资产</span></div>
  </header>

  <section class="card" id="status-card" aria-live="polite" aria-atomic="true">
    <span class="dot" id="dot" aria-hidden="true"></span>
    <div class="copy">
      <strong id="state-label">检查中</strong>
      <p id="status">正在检测…</p>
    </div>
    <button type="button" class="ghost" id="retry" aria-label="重新检测连接" title="重新检测">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
    </button>
  </section>

  <section class="group">
    <h1 id="prefs-title">采集偏好</h1>
    <label class="row">
      <span>
        <strong id="pref-selection-title">划词保存</strong>
        <small id="pref-selection-hint">选中文字时显示保存按钮</small>
      </span>
      <input id="pref-selection" type="checkbox" role="switch" aria-label="划词保存" checked>
    </label>
    <label class="row">
      <span>
        <strong id="pref-image-title">图片悬浮</strong>
        <small id="pref-image-hint">悬停图片时显示保存按钮</small>
      </span>
      <input id="pref-image" type="checkbox" role="switch" aria-label="图片悬浮" checked>
    </label>
  </section>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
