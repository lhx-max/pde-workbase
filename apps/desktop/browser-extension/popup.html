<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bezier Design capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header>
    <span class="mark" aria-hidden="true">
      <img src="logo.svg" width="72" height="28" alt="Loom">
    </span>
    <div class="heading"><strong id="popup-title">Bezier Design capture</strong><span id="popup-tagline">Turn what you find into your own assets</span></div>
  </header>

  <section class="card" id="status-card" aria-live="polite" aria-atomic="true">
    <span class="dot" id="dot" aria-hidden="true"></span>
    <div class="copy">
      <strong id="state-label">Checking</strong>
      <p id="status">Checking…</p>
    </div>
    <button type="button" class="ghost" id="retry" aria-label="Check the connection again" title="Check again">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
    </button>
  </section>

  <section class="group">
    <h1 id="prefs-title">Capture</h1>
    <label class="row">
      <span>
        <strong id="pref-selection-title">Save selected text</strong>
        <small id="pref-selection-hint">Show a save button when text is selected</small>
      </span>
      <input id="pref-selection" type="checkbox" role="switch" aria-label="Save selected text" checked>
    </label>
    <label class="row">
      <span>
        <strong id="pref-image-title">Image hover</strong>
        <small id="pref-image-hint">Show a save button when the pointer is over an image</small>
      </span>
      <input id="pref-image" type="checkbox" role="switch" aria-label="Image hover" checked>
    </label>
  </section>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
